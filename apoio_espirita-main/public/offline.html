<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem conexão — Apoio Espírita</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f7f8fc;
        color: #111418;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      .cartao {
        max-width: 460px;
        width: 100%;
        background: #fff;
        border: 1px solid rgba(0, 20, 70, 0.1);
        border-radius: 24px;
        box-shadow: 0 12px 32px rgba(0, 20, 70, 0.08);
        padding: 40px 32px;
        text-align: center;
      }
      .marca {
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        display: block;
      }
      h1 {
        font-family: "Libre Caslon Text", Georgia, serif;
        font-size: 1.5rem;
        font-weight: 400;
        margin: 0 0 12px;
      }
      p {
        font-size: 0.95rem;
        line-height: 1.6;
        color: #637080;
        margin: 0 0 12px;
      }
      button {
        margin-top: 20px;
        width: 100%;
        min-height: 48px;
        padding: 14px 20px;
        border-radius: 14px;
        border: 1px solid rgba(0, 74, 140, 0.4);
        background: #fff;
        color: #004a8c;
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
      }
      button:hover {
        background: rgba(0, 74, 140, 0.06);
      }
    </style>
  </head>
  <body>
    <main class="cartao">
      <img class="marca" src="/favicon.png" alt="" />
      <h1>Sem conexão com a internet</h1>
      <p>
        Não foi possível carregar esta página porque o seu aparelho está sem conexão no momento.
      </p>
      <p>
        Verifique o wi-fi ou os dados móveis e tente novamente. Nada do que você já enviou foi
        perdido.
      </p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
