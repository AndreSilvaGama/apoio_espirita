name: Vigia diário

# ATENÇÃO: este arquivo precisa ficar em .github/workflows/ NA RAIZ do repositório.
# O projeto mora na subpasta apoio_espirita-main/, e o GitHub ignora workflows que
# estejam dentro de subpastas — foi por isso que o resumo diário nunca rodou e nada
# gerava atividade no banco, o que deixou o projeto Supabase ser pausado.

on:
  schedule:
    # 08h00 de Brasília (UTC-3) = 11h00 UTC
    - cron: "0 11 * * *"
  workflow_dispatch:
    # Permite disparar à mão pelo GitHub para testar

permissions:
  # write porque o passo da estrutura commita supabase/schema.sql de volta
  contents: write
  issues: write

env:
  SUPABASE_URL: https://kitmwxfwwujygcmdjngm.supabase.co
  # Conexao ao Postgres por variaveis separadas, NAO por URI.
  # Uma URI quebra quando a senha tem @ ! # / : ? ou acento — e pior: o libpq
  # trata o resto como nome de host e IMPRIME esse pedaco na mensagem de erro.
  # Em repositorio publico isso vaza a senha no log. Com PG* isso nao ocorre.
  # Host e usuario nao sao segredo (a ref do projeto ja e publica no repo).
  PGHOST: aws-1-us-east-1.pooler.supabase.com
  PGPORT: "5432"
  PGUSER: postgres.kitmwxfwwujygcmdjngm
  PGDATABASE: postgres
  PGSSLMODE: require
  # Chave anônima: pública por natureza, protegida pela RLS. Não é segredo.
  SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtpdG13eGZ3d3VqeWdjbWRqbmdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MjEwNTYsImV4cCI6MjA5NDA5NzA1Nn0.Er_7LFPyup8LjcFaGuIAKMHcIVzJfbU-ihVs_r-IkXE

jobs:
  vigia:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          # precisa do histórico para conseguir commitar e empurrar
          fetch-depth: 0

      # 1) Confere se o banco responde E, de quebra, gera a atividade diária que
      #    impede o Supabase de pausar o projeto por inatividade.
      - name: Verificar se o banco responde
        id: banco
        run: |
          set +e
          STATUS=$(curl -s -m 30 -o /tmp/banco.json -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/siglas_casas?select=sigla&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $STATUS"
          head -c 300 /tmp/banco.json || true
          echo ""
          if [ "$STATUS" = "200" ]; then
            echo "resultado=ok" >> "$GITHUB_OUTPUT"
          else
            echo "resultado=falhou" >> "$GITHUB_OUTPUT"
            echo "codigo=$STATUS" >> "$GITHUB_OUTPUT"
          fi

      # 2) Confere se o site está no ar.
      - name: Verificar se o site responde
        id: site
        run: |
          set +e
          STATUS=$(curl -s -m 30 -o /dev/null -w "%{http_code}" https://apoioespirita.com.br/)
          echo "HTTP $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "resultado=ok" >> "$GITHUB_OUTPUT"
          else
            echo "resultado=falhou" >> "$GITHUB_OUTPUT"
            echo "codigo=$STATUS" >> "$GITHUB_OUTPUT"
          fi

      # 3) Abre um aviso no GitHub quando algo caiu. E-mail passa despercebido;
      #    uma issue aberta fica visível até alguém resolver.
      - name: Abrir aviso se algo caiu
        if: steps.banco.outputs.resultado == 'falhou' || steps.site.outputs.resultado == 'falhou'
        uses: actions/github-script@v7
        with:
          script: |
            const banco = '${{ steps.banco.outputs.resultado }}';
            const site = '${{ steps.site.outputs.resultado }}';
            const codBanco = '${{ steps.banco.outputs.codigo }}';
            const codSite = '${{ steps.site.outputs.codigo }}';

            const titulo = 'Apoio Espírita fora do ar';
            const abertas = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'vigia',
            });
            if (abertas.data.some((i) => i.title === titulo)) {
              core.info('Já existe um aviso aberto. Não vou duplicar.');
              return;
            }

            const linhas = [
              'A verificação automática encontrou um problema.',
              '',
              `- Banco de dados (Supabase): **${banco === 'ok' ? 'respondendo' : `NÃO respondeu (HTTP ${codBanco})`}**`,
              `- Site (apoioespirita.com.br): **${site === 'ok' ? 'respondendo' : `NÃO respondeu (HTTP ${codSite})`}**`,
              '',
              '### O que verificar primeiro',
              '',
              'Se o banco não respondeu, a causa mais provável é o **projeto Supabase ter sido pausado**',
              'por inatividade — o plano Free pausa após 7 dias de pouco uso. Nesse caso o site continua',
              'respondendo normalmente, mas login, cadastro e toda a área autenticada param.',
              '',
              '1. Abra https://supabase.com/dashboard/project/kitmwxfwwujygcmdjngm',
              '2. Se aparecer **Resume project**, clique e aguarde cerca de 2 minutos',
              '3. Confirme que voltou: `nslookup kitmwxfwwujygcmdjngm.supabase.co` deve resolver',
              '',
              'Há uma janela de **90 dias** para restaurar um projeto pausado. Depois disso os dados se perdem.',
              '',
              '_Aviso gerado automaticamente pelo workflow Vigia diário._',
            ];

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: titulo,
              body: linhas.join('\n'),
              labels: ['vigia'],
            });

      # 4) Backup criptografado do banco.
      #    O plano Free do Supabase não oferece backup para download, e este
      #    repositório é PÚBLICO — por isso o dump é cifrado com uma senha que
      #    só o Andre tem antes de virar artefato. Sem a senha, o arquivo é
      #    inútil para quem baixar.
      #    Exige dois segredos no repositório: SUPABASE_DB_PASSWORD e BACKUP_PASSPHRASE.
      - name: Verificar se o backup está configurado
        id: cfg_backup
        run: |
          if [ -n "${{ secrets.SUPABASE_DB_PASSWORD }}" ] && [ -n "${{ secrets.BACKUP_PASSPHRASE }}" ]; then
            echo "pronto=sim" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=nao" >> "$GITHUB_OUTPUT"
            echo "::warning::Backup não configurado. Cadastre os segredos SUPABASE_DB_PASSWORD e BACKUP_PASSPHRASE."
          fi

      - name: Instalar o cliente PostgreSQL 17
        if: steps.banco.outputs.resultado == 'ok' && steps.cfg_backup.outputs.pronto == 'sim'
        run: |
          # O runner traz um pg_dump mais antigo que o servidor (Postgres 17),
          # e versões diferentes recusam o dump.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      - name: Gerar backup criptografado
        if: steps.banco.outputs.resultado == 'ok' && steps.cfg_backup.outputs.pronto == 'sim'
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SENHA: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          CARIMBO=$(date -u +%Y-%m-%d)
          mkdir -p backup

          # Estrutura + dados do schema da aplicação.
          pg_dump \
            --schema=public \
            --no-owner --no-privileges \
            --clean --if-exists \
            --file=backup/apoio-espirita-$CARIMBO.sql

          # Contas de acesso. Sem isto, restaurar traz os perfis mas ninguém entra.
          pg_dump \
            --schema=auth --data-only \
            --no-owner --no-privileges \
            --file=backup/auth-users-$CARIMBO.sql

          LINHAS=$(wc -l < backup/apoio-espirita-$CARIMBO.sql)
          echo "Dump gerado: $LINHAS linhas"
          if [ "$LINHAS" -lt 50 ]; then
            echo "::error::Dump suspeito de vazio ($LINHAS linhas). Backup abortado."
            exit 1
          fi

          tar -czf backup.tar.gz -C backup .
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$SENHA" \
            --output apoio-espirita-$CARIMBO.tar.gz.gpg \
            backup.tar.gz
          rm -rf backup backup.tar.gz

          echo "Arquivo cifrado: $(du -h apoio-espirita-$CARIMBO.tar.gz.gpg | cut -f1)"
          echo "carimbo=$CARIMBO" >> "$GITHUB_ENV"

      # A estrutura do banco (sem UM dado sequer) versionada no repositório.
      # As migrações escritas à mão descreviam só 9 das 27 tabelas e já induziram
      # a erro. Gerado pelo pg_dump, este arquivo é exato e se mantém sozinho.
      - name: Atualizar a estrutura do banco no repositório
        if: steps.banco.outputs.resultado == 'ok' && steps.cfg_backup.outputs.pronto == 'sim'
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          DESTINO=apoio_espirita-main/supabase/schema.sql

          pg_dump \
            --schema=public --schema-only \
            --no-owner --no-privileges \
            --file=/tmp/schema.sql

          # Rede de segurança: nunca gravar um schema truncado por cima do bom.
          if [ "$(grep -c 'CREATE TABLE' /tmp/schema.sql)" -lt 20 ]; then
            echo "::error::Schema com menos de 20 tabelas. Não vou sobrescrever."
            exit 1
          fi
          # E nunca vazar dado: --schema-only não emite COPY nem INSERT.
          if grep -qE '^(COPY|INSERT INTO)' /tmp/schema.sql; then
            echo "::error::O dump traz dados. Abortado para não publicar dado em repo público."
            exit 1
          fi

          {
            echo "-- Estrutura do banco de produção, gerada automaticamente pelo Vigia diário."
            echo "-- NÃO EDITE À MÃO: este arquivo é sobrescrito todo dia pelo pg_dump."
            echo "-- Contém apenas estrutura (tabelas, RLS, políticas, funções). Nenhum dado."
            echo "--"
            cat /tmp/schema.sql
          } > "$DESTINO"

          # git diff IGNORA arquivo nao rastreado — na primeira vez o schema.sql
          # nao existia no repositorio e o passo se achava sem trabalho a fazer.
          # Por isso: adicionar PRIMEIRO, e so entao perguntar se mudou algo.
          git config user.name "Vigia diário"
          git config user.email "actions@github.com"
          git add "$DESTINO"

          if git diff --cached --quiet -- "$DESTINO"; then
            echo "Estrutura sem mudanças desde ontem."
          else
            git commit -m "chore: atualiza a estrutura do banco (automático)"
            git push
            echo "Estrutura atualizada e commitada."
          fi

      # As casas que publicaram sua página entram no sitemap, para quem procura
      # um centro espírita encontrá-las no Google. Lista pela API com a chave
      # anônima — que só enxerga página publicada, então o filtro vem do banco.
      # Casa sem nome preenchido fica de fora: página vazia indexada é pior
      # que página nenhuma.
      # As casas que publicaram sua página entram no sitemap, para quem procura
      # um centro espírita encontrá-las no Google. Lista pela API com a chave
      # anônima — que só enxerga página publicada, então o filtro vem do banco.
      # Casa sem nome preenchido fica de fora: página vazia indexada é pior
      # que página nenhuma.
      - name: Atualizar o sitemap com as casas publicadas
        if: steps.banco.outputs.resultado == 'ok'
        run: |
          set -euo pipefail
          SITEMAP=apoio_espirita-main/public/sitemap.xml

          curl -s -m 30             "$SUPABASE_URL/rest/v1/paginas_casas?select=sigla_casa,nome_completo&publicada=eq.true"             -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY"             > /tmp/casas.json

          cat > /tmp/sitemap.py <<'PY'
          import json, re, sys, datetime
          arq = sys.argv[1]
          hoje = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d")
          dados = json.load(open("/tmp/casas.json", encoding="utf-8"))
          casas = sorted(c["sigla_casa"] for c in dados if (c.get("nome_completo") or "").strip())
          s = open(arq, encoding="utf-8").read()
          s = re.sub(r"\s*<!-- casas -->.*?<!-- /casas -->", "", s, flags=re.S)
          if casas:
              blocos = "".join(
                  "
  <url>
    <loc>https://apoioespirita.com.br/casa/%s</loc>
"
                  "    <lastmod>%s</lastmod>
    <changefreq>weekly</changefreq>
"
                  "    <priority>0.8</priority>
  </url>" % (c, hoje) for c in casas)
              s = s.replace("</urlset>", "  <!-- casas -->%s
  <!-- /casas -->
</urlset>" % blocos)
          open(arq, "w", encoding="utf-8", newline="").write(s)
          print("casas no sitemap:", len(casas))
          PY
          python3 /tmp/sitemap.py "$SITEMAP"

          # O passo da estrutura pode ter sido pulado, entao configurar aqui tambem.
          git config user.name "Vigia diário"
          git config user.email "actions@github.com"
          git add "$SITEMAP"
          if git diff --cached --quiet -- "$SITEMAP"; then
            echo "Sitemap sem mudanças."
          else
            git commit -m "chore: atualiza o sitemap com as casas publicadas (automático)"
            git push
            echo "Sitemap atualizado."
          fi

      - name: Guardar o backup por 90 dias
        if: steps.banco.outputs.resultado == 'ok' && steps.cfg_backup.outputs.pronto == 'sim'
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ env.carimbo }}
          path: "*.tar.gz.gpg"
          retention-days: 90
          if-no-files-found: error

      # 5) Envia o resumo diário (a função que nunca chegou a rodar).
      #    Só tenta se o banco estiver de pé, para não gerar ruído.
      - name: Enviar resumo diário
        if: steps.banco.outputs.resultado == 'ok'
        continue-on-error: true
        run: |
          STATUS=$(curl -s -m 60 -o /tmp/resp.json -w "%{http_code}" \
            -X POST \
            "$SUPABASE_URL/functions/v1/daily-digest" \
            -H "x-cron-secret: ${{ secrets.DIGEST_CRON_SECRET }}" \
            -H "Content-Type: application/json")
          echo "HTTP $STATUS"
          cat /tmp/resp.json || true

      # 6) Falha o job para o GitHub avisar por e-mail, além da issue.
      - name: Encerrar com erro se algo caiu
        if: steps.banco.outputs.resultado == 'falhou' || steps.site.outputs.resultado == 'falhou'
        run: |
          echo "Banco: ${{ steps.banco.outputs.resultado }} | Site: ${{ steps.site.outputs.resultado }}"
          exit 1
